<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Local WebP Compressor</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Required for HEIC conversion fallback[cite: 9] -->
  <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen p-6 font-sans">
  
  <div class="max-w-4xl mx-auto">
    <div class="mb-8">
      <h1 class="text-3xl font-bold uppercase tracking-wider text-[#E5FF00] mb-2">Local Image Compressor</h1>
      <p class="text-gray-400 text-sm">Target: < 200KB, Max Dimension: 1440px, Format: WebP[cite: 9]. Runs entirely in your browser.</p>
    </div>

    <!-- Drag & Drop Zone -->
    <div id="dropZone" class="border-2 border-dashed border-white/20 rounded-xl p-12 text-center bg-gray-800 hover:bg-gray-800/80 hover:border-[#E5FF00]/50 transition-all cursor-pointer relative overflow-hidden">
      <input type="file" id="fileInput" multiple accept="image/jpeg, image/png, image/webp, image/jpg, image/heic, image/heif, .heic, .heif" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10" />
      <div class="pointer-events-none">
        <svg class="w-12 h-12 mx-auto mb-4 text-[#E5FF00]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
        <h3 class="font-bold text-lg uppercase tracking-widest text-white mb-2">Drop Images Here</h3>
        <p class="text-sm text-gray-400">or click to browse</p>
      </div>
    </div>

    <!-- Results Area -->
    <div id="resultsArea" class="mt-8 space-y-4 hidden">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-xl font-bold">Processed Files</h2>
        <button id="downloadAllBtn" class="bg-[#E5FF00] text-black px-4 py-2 rounded-md font-bold text-sm uppercase tracking-widest hover:bg-white transition-colors hidden">
          Download All
        </button>
      </div>
      <div id="fileList" class="space-y-3"></div>
    </div>
  </div>

  <script>
    const fileInput = document.getElementById('fileInput');
    const dropZone = document.getElementById('dropZone');
    const resultsArea = document.getElementById('resultsArea');
    const fileList = document.getElementById('fileList');
    const downloadAllBtn = document.getElementById('downloadAllBtn');
    
    let processedFiles = []; // Store blobs for "Download All"

    // UI Feedback for Drag & Drop
    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.classList.add('border-[#E5FF00]', 'bg-gray-700');
    });
    dropZone.addEventListener('dragleave', () => {
      dropZone.classList.remove('border-[#E5FF00]', 'bg-gray-700');
    });
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('border-[#E5FF00]', 'bg-gray-700');
      if (e.dataTransfer.files.length) handleFiles(e.dataTransfer.files);
    });
    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length) handleFiles(e.target.files);
      e.target.value = ''; // Reset
    });

    const formatBytes = (bytes) => {
      if (bytes === 0) return '0 Bytes';
      const k = 1024;
      const sizes = ['Bytes', 'KB', 'MB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    };

    // EXACT MEMORY-SAFE CONVERTER ADAPTED FROM MEDIAMANAGER.TSX[cite: 9]
    async function convertToWebpMemorySafe(file, maxDim = 1440, targetSizeKb = 200) {
      const originalNameWithoutExt = file.name.substring(0, file.name.lastIndexOf('.')) || file.name;
      const webpName = `${originalNameWithoutExt}.webp`;
      const isHeic = file.type === 'image/heic' || file.type === 'image/heif' || file.name.toLowerCase().endsWith('.heic') || file.name.toLowerCase().endsWith('.heif');

      let imageSource = null;

      try {
        if (isHeic) {
          try {
            imageSource = await createImageBitmap(file);
          } catch {
            const convertedBlob = await heic2any({ blob: file, toType: 'image/png' });
            const singleBlob = Array.isArray(convertedBlob) ? convertedBlob[0] : convertedBlob;
            imageSource = await createImageBitmap(singleBlob);
          }
        } else {
          imageSource = await createImageBitmap(file);
        }
      } catch (err) {
        console.error("Failed to decode image:", err);
        return file;
      }

      // Initial dimensional scale-down to maxDim[cite: 9]
      let width = imageSource.width;
      let height = imageSource.height;
      if (width > maxDim || height > maxDim) {
        if (width > height) {
          height = Math.round((height * maxDim) / width);
          width = maxDim;
        } else {
          width = Math.round((width * maxDim) / height);
          height = maxDim;
        }
      }

      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');

      if (!ctx) {
        if (imageSource.close) imageSource.close();
        return file;
      }

      ctx.drawImage(imageSource, 0, 0, width, height);

      // Free RAM instantly[cite: 9]
      if (imageSource.close) imageSource.close();

      const targetBytes = targetSizeKb * 1024;
      let webpBlob = null;

      const getCanvasBlob = (q) => new Promise((resolve) => canvas.toBlob(resolve, 'image/webp', q));

      // STEP 1: Iterative Quality Adjustments (Binary Search)[cite: 9]
      let minQ = 0.75; 
      let maxQ = 1.0;
      let quality = 0.95; 
      let attempts = 0;
      const maxAttempts = 5;

      webpBlob = await getCanvasBlob(quality);

      while (webpBlob && webpBlob.size > targetBytes && attempts < maxAttempts) {
        maxQ = quality;
        quality = (minQ + maxQ) / 2; 
        webpBlob = await getCanvasBlob(quality);
        attempts++;
      }

      // STEP 2: Dimensional Scaling Fallback (15% reduction)[cite: 9]
      let currentWidth = width;
      let currentHeight = height;
      
      while (webpBlob && webpBlob.size > targetBytes && currentWidth > 600) {
        currentWidth = Math.round(currentWidth * 0.85);
        currentHeight = Math.round(currentHeight * 0.85);

        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = currentWidth;
        tempCanvas.height = currentHeight;
        const tempCtx = tempCanvas.getContext('2d');
        
        if (tempCtx) {
          tempCtx.drawImage(canvas, 0, 0, currentWidth, currentHeight);
          webpBlob = await new Promise((resolve) => tempCanvas.toBlob(resolve, 'image/webp', quality));
        }
      }

      // Trigger GC on original canvas[cite: 9]
      canvas.width = 0;
      canvas.height = 0;

      if (!webpBlob) return file;

      return new File([webpBlob], webpName, { type: 'image/webp' });
    }

    async function handleFiles(files) {
      resultsArea.classList.remove('hidden');
      
      // Process sequentially to prevent browser memory spikes[cite: 9]
      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        
        // Create UI Row
        const fileId = `file-${Date.now()}-${i}`;
        const row = document.createElement('div');
        row.id = fileId;
        row.className = 'bg-gray-800 p-4 rounded-lg flex items-center justify-between border border-white/5';
        row.innerHTML = `
          <div class="flex flex-col w-1/2">
            <span class="font-medium truncate text-sm">${file.name}</span>
            <span class="text-xs text-gray-400">Original: ${formatBytes(file.size)}</span>
          </div>
          <div id="status-${fileId}" class="flex items-center gap-3 text-sm">
            <span class="animate-pulse text-[#E5FF00]">Compressing...</span>
          </div>
        `;
        fileList.appendChild(row);

        // Compress
        const compressedFile = await convertToWebpMemorySafe(file);
        
        // Store for download all
        const objectUrl = URL.createObjectURL(compressedFile);
        processedFiles.push({ url: objectUrl, name: compressedFile.name });

        // Update UI Row
        const statusDiv = document.getElementById(`status-${fileId}`);
        const savings = ((file.size - compressedFile.size) / file.size * 100).toFixed(1);
        
        statusDiv.innerHTML = `
          <div class="text-right mr-4 hidden sm:block">
            <div class="text-[#E5FF00] font-bold">${formatBytes(compressedFile.size)}</div>
            <div class="text-xs text-green-400">-${savings}%</div>
          </div>
          <button onclick="downloadFile('${objectUrl}', '${compressedFile.name}')" class="bg-white/10 hover:bg-white/20 text-white px-3 py-1.5 rounded text-xs font-bold uppercase tracking-widest transition-colors flex items-center">
            <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
            Save
          </button>
        `;
      }
      
      if (processedFiles.length > 1) {
        downloadAllBtn.classList.remove('hidden');
      }
    }

    // Trigger local download
    window.downloadFile = (url, filename) => {
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    };

    downloadAllBtn.addEventListener('click', () => {
      processedFiles.forEach((f, index) => {
        setTimeout(() => {
          downloadFile(f.url, f.name);
        }, index * 200); // Stagger downloads slightly to prevent browser blocking
      });
    });
  </script>
</body>
</html>
